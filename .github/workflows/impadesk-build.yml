name: Build ImpaDesk (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "17.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    name: Generate flutter-rust bridge
    uses: ./.github/workflows/bridge.yml

  build-windows:
    name: Build ImpaDesk x64
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Replace engine with custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterRoot = (Get-Command flutter).Source | Split-Path | Split-Path
          $dest = "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release"
          Write-Host "Patching engine at: $dest"
          Copy-Item -Path windows-x64-release\* -Destination $dest -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || echo "patch already applied"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: impadesk-windows

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build ImpaDesk
        shell: pwsh
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec
          move .\flutter\build\windows\x64\runner\Release .\impadesk
          # The portable packer derives the extraction folder from the payload
          # executable's name, so rename before packing to keep it "impadesk".
          Rename-Item -Path .\impadesk\rustdesk.exe -NewName ImpaDesk.exe

      - name: Build single-file installer
        shell: pwsh
        run: |
          python -m pip install -r .\libs\portable\requirements.txt
          cd .\libs\portable
          python .\generate.py -f "..\..\impadesk" -o . -e "..\..\impadesk\ImpaDesk.exe"
          cargo build --locked --release
          # libs/portable is a workspace member, so cargo puts the binary in the
          # workspace target dir, not the crate-local one.
          Copy-Item .\..\..\target\release\rustdesk-portable-packer.exe "..\..\ImpaDesk-install.exe" -Force
          Get-Item "..\..\ImpaDesk-install.exe" | Format-List Name,Length

      - name: Upload ImpaDesk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImpaDesk-windows-x64
          path: |
            ImpaDesk-install.exe
            impadesk
          retention-days: 30
